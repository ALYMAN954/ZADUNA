    guard(() => { const id = fd.get('who') || 'abdullah'; Z.user = Z.member(id); Z.setPassword(id, pw); Z.db.meta.setupDone = true; Z.log('setup', 'إعداد الجوال'); App.save(); App.setSession(Z.member(id)); location.hash = '#/home'; render(); celebrate({ title: 'بسم الله نبدأ', text: 'جاهزون لرحلة زادُنا. أرسل ملف المزامنة للجوال الآخر من زر المزامنة أعلى الشاشة.', book: true }); }); },
  mem(fd) { guard(() => { const r = Z.registerMemorization({ memberId: fd.get('memberId'), from: fd.get('from'), to: fd.get('to'), date: fd.get('date'), note: fd.get('note') });
    const parts = []; if (r.created.length) parts.push(`سُجّلت ${r.created.length} صفحة بانتظار التسميع`); if (r.asRevision.length) parts.push(`${r.asRevision.length} صفحة محفوظة سابقاً سُجّلت كمراجعة`); if (r.skipped.length) parts.push(`${r.skipped.length} صفحة مسجلة مسبقاً`);
    toast(parts.join(' · ') || 'لا جديد'); Sound.play('soft'); UI.memF.m = fd.get('memberId'); UI.memF.s = 'open'; UI.preset = fd.get('memberId'); render();
    if (r.created.length) { const el = sheet(`<h3>تم التسجيل</h3><p>${parts.join('<br>')}</p><div class="grid g2"><button class="btn primary" id="goR">${ic('mic')} ابدأ التسميع الآن</button><button class="btn" onclick="closeSheet()">لاحقاً</button></div>`); $('#goR', el).onclick = () => { closeSheet(); UI.rc = { memberId: fd.get('memberId'), kind: 'mem', timing: 'now', pages: r.created.map(x => x.page) }; location.hash = '#/recite'; }; }
    }); },
  session(fd) { guard(() => { const rc = UI.rc; let pages = rc.kind === 'mem' ? fd.getAll('pages').map(Number) : []; if (rc.kind === 'rev') { const a = +fd.get('from'), b = +(fd.get('to') || a); for (let p = a; p <= b; p++) pages.push(p); }
    const when = rc.timing === 'later' && fd.get('when') ? new Date(fromRiyadhInput(fd.get('when'))).toISOString() : null;
    const s = Z.createSession({ memberId: fd.get('memberId'), kind: rc.kind, pages, evaluatorId: fd.get('evaluatorId'), scheduledAt: when }); UI.rc = {};
    if (when) { toast('جُدولت الجلسة'); render(); } else location.hash = '#/recite/s/' + s.id; }); },
  evaluate(fd, form, sub) { const decision = sub?.value; const go = reason => guard(() => { const s = Z.db.sessions.find(x => x.id === form.dataset.id);
      const { r, fresh } = badgeWatch(s.memberId, () => Z.submitSession(s.id, { grade: fd.get('grade'), errors: UI.evalErrors, errorCount: +fd.get('errorCount'), notes: fd.get('notes'), decision, reason }));
      UI.evalErrors = []; UI.evalFor = null;
      if (s.kind === 'mem' && decision === 'approve') afterApprove(s.memberId, [...r.rewards, ...r.withheld.map(p => ({ page: p, withheld: true, reward: 0 }))], fresh);
      else if (decision === 'approve') celebrate({ title: 'مراجعة مباركة', text: `سُجّلت مراجعة ${s.pages.length} صفحة لـ${mName(s.memberId)}`, book: true });
      else toast(decision === 'save' ? 'حُفظت النتيجة — بانتظار اعتماد المشرف' : decision === 'redo' ? 'سُجّل طلب إعادة التسميع' : 'سُجّل الرفض مع السبب');
      location.hash = '#/recite'; });
    if (decision === 'reject') { const el = sheet(`<h3>سبب الرفض</h3><form id="rj"><textarea class="inp" name="r" required></textarea><button class="btn danger block" style="margin-top:10px">تأكيد الرفض</button></form>`); $('#rj', el).onsubmit = e => { e.preventDefault(); closeSheet(); go(e.target.r.value); }; } else go(''); },
  rev(fd) { guard(() => { const r = Z.addRevision({ memberId: fd.get('memberId'), from: fd.get('from'), to: fd.get('to'), date: fd.get('date'), grade: fd.get('grade'), notes: fd.get('notes') }); toast(`سُجّلت مراجعة ${r.pages.length} صفحة — ${enc()}`); Sound.play('soft'); UI.revM = fd.get('memberId'); render(); }); },
  testApprove(fd, form) { guard(() => { const t = Z.db.tests.find(x => x.id === form.dataset.id); const e = {}; t.pages.forEach(p => e[p] = +fd.get('e' + p));
    const { r, fresh } = badgeWatch(t.memberId, () => Z.approveTest(t.id, { errors: e, notes: fd.get('notes') }));
    if (r.passed) celebrate({ title: 'اختبار متقن!', text: `${mName(t.memberId)} اجتاز الاختبار دون أي خطأ${r.reward ? ` وحصل على <b>${fmt.money(r.reward)}</b>` : ''}`, coins: r.reward ? 6 : 0, extra: fresh.length ? `<div class="chip gold" style="margin-bottom:10px">وسام جديد: ${fresh.map(b => b.name).join('، ')}</div>` : '' });
    else toast('اعتُمدت النتيجة — نراجع مواضع الخطأ ونعود أقوى'); render(); }); },
  testCorrect(fd, form) { guard(() => { const t = Z.db.tests.find(x => x.id === form.dataset.id); const e = {}; t.pages.forEach(p => e[p] = +fd.get('e' + p)); const tx = Z.correctTest(t.id, { errors: e, reason: fd.get('reason') }); toast(tx ? `صُحّحت النتيجة وعُدّلت المكافأة (${fmt.sign(tx.amount)})` : 'صُحّحت النتيجة ووُثّقت'); render(); }); },
  wallet(fd, form) { guard(() => { const t = Z.walletAction({ memberId: UI.wm, kind: form.dataset.k, amount: fd.get('amount'), reason: fd.get('reason'), opId: form.dataset.op }); closeSheet(); if (t && t.amount > 0) coinRain(10); toast(`تمت العملية · الرصيد ${fmt.money(Z.balance(UI.wm))}`); render(); }); },
  vio(fd) { guard(() => { const s = fromRiyadhInput(fd.get('start')); const e = UI.vd === 'c' ? fromRiyadhInput(fd.get('end')) : s + (+UI.vd) * DAY;
    Z.addViolation({ memberId: fd.get('memberId'), reason: fd.get('reason'), start: new Date(s).toISOString(), end: new Date(e).toISOString() }); toast('سُجّلت المخالفة'); render(); }); },
  challenge(fd) { guard(() => { const g = k => { const m = fd.get('m_' + k); if (!m) return null; return m === 'surah' ? { metric: m, param: +fd.get('s_' + k) } : { metric: m, target: +fd.get('t_' + k) || 1 }; };
    const goals = {}; Z.participants().forEach(m => { const x = g(m.id); if (x) goals[m.id] = x; });
    Z.createChallenge({ title: fd.get('title'), start: fd.get('start'), end: fd.get('end'), family: g('family'), goals, bonus: fd.get('bonus') }); closeSheet(); celebrate({ title: 'انطلق التحدي!', text: 'أُوقدت فوانيس الأسرة — كل صفحة تزيدها نوراً', book: false }); render(); }); },
  settings(fd) { guard(() => { Z.need('admin'); const st = Z.db.settings; const list = k => String(fd.get(k) || '').split(/[،,]/).map(x => x.trim()).filter(Boolean);
    const mr = +fd.get('memReward'), tr = +fd.get('testReward'); if (!(mr >= 0 && tr >= 0)) throw new ZadunaError('قيم غير صحيحة');
    Object.assign(st, { memReward: mr, testReward: tr, suspendTestRewards: !!fd.get('suspendTestRewards'), grades: list('grades').length ? list('grades') : st.grades, revGrades: list('revGrades').length ? list('revGrades') : st.revGrades, errorTypes: list('errorTypes').length ? list('errorTypes') : st.errorTypes, updatedAt: nowIso() });
    Z.log('settings.update', `حفظ ${mr} · اختبار ${tr}`); App.save(); toast('حُفظت الإعدادات'); render(); }); },
  async member(fd, form) { const id = form.dataset.id; const role = fd.get('role') || (id ? Z.member(id).role : 'supervisor');
    const elevating = role !== 'child' && (!id || Z.member(id).role !== role || fd.get('pw'));
    if (elevating && id !== Z.user.id) { const pw = await askPassword(Z.user, 'أكّد بكلمة سرك'); if (pw == null) return; if (!Z.checkPassword(Z.user.id, pw)) return toast('كلمة السر غير صحيحة', 'err'); }
    guard(() => { const data = { name: fd.get('name'), title: fd.get('title'), participates: !!fd.get('participates'), avatar: fd.get('avatar'), hue: +fd.get('hue') };
      if (!id) Z.addMember(Object.assign(data, { role, password: fd.get('pw') }));
      else { Z.updateMember(id, Object.assign(data, fd.get('role') ? { role } : {})); if (fd.get('pw')) { Z.setPassword(id, fd.get('pw')); Z.log('password.set', data.name); App.save(); } }
      closeSheet(); toast('تم الحفظ'); render(); }); },
};

/* ---------------- sync ---------------- */
function syncSheet() { sheet(`<h3>المزامنة</h3><p class="muted small">أرسل نسخة من هذا الجوال، أو استلم نسخة الجوال الآخر لدمجها.</p><div class="grid g2"><button class="btn primary" data-act="syncOut">${ic('share')} إرسال</button><button class="btn gold" data-act="syncIn">${ic('inbox')} استلام</button></div><p class="tiny muted" style="margin-bottom:0">آخر استلام: ${Z.db.meta.lastSync ? fmt.date(Z.db.meta.lastSync, 1) : '—'}</p>`); }
async function sendSync() {
  const data = JSON.stringify(Z.exportData()); const stamp = riyadhInput(Clock.now()).replace(/[-:T]/g, '').slice(0, 12);
  const name = `zaduna-${App.mode === 'demo' ? 'demo-' : ''}${Z.user ? Z.user.id : 'sync'}-${stamp}.json`; Z.log('sync.export', name); App.save();
  try { const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'زادُنا — ملف مزامنة', text: 'افتح زادُنا ← المزامنة ← استلام، واختر هذا الملف.' }); toast('أُرسل ملف المزامنة'); closeSheet(); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  download(name, data, 'application/json'); toast('حُفظ الملف — أرسله عبر واتساب للجوال الآخر'); closeSheet();
}
function receiveSync() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => guard(() => { let d; try { d = JSON.parse(rd.result); } catch (e) { throw new ZadunaError('الملف تالف أو ليس ملف زادُنا'); }
      const firstTime = !Z.db.meta.setupDone; const st = Z.merge(d); App.save(); closeSheet();
      celebrate({ title: 'تمت المزامنة', text: `أُضيف ${st.added} سجلاً وحُدّث ${st.updated}. البيانات الآن متطابقة مع الجوال الآخر.`, book: false }); if (firstTime || !Z.user) location.hash = '#/'; render(); });
    rd.readAsText(f); };
  inp.click();
}

/* ---------------- demo data ---------------- */
const Demo = {
  build() {
    const db = emptyDB(true), keep = { db: Z.db, user: Z.user, now: Clock.now, oc: Z.onChange }; Z.load(db); Z.onChange = () => { };
    try {
      db.meta.setupDone = true; Z.user = Z.member('abdullah'); Z.setPassword('abdullah', '1234'); Z.setPassword('iman', '1234');
      const base = riyadhStart(todayKey()); const at = (d, h) => () => base - d * DAY + h * 3600000;
      const plan = { abdullah: { p: 293, step: 1 }, iman: { p: 562, step: 1 }, alyaman: { p: 582, step: 1 }, abdulrahman: { p: 589, step: 1 }, kenan: { p: 600, step: 1 } };
      // pre-history: pages already approved before the visible window
      const pre = { abdullah: [[1, 21]], iman: [[1, 8]], alyaman: [[591, 604]], abdulrahman: [[598, 604]], kenan: [] };
      Clock.now = at(40, 17);
      Object.entries(pre).forEach(([id, rs]) => rs.forEach(([a, b]) => { Z.user = Z.member(id === 'iman' ? 'abdullah' : 'iman'); Z.registerMemorization({ memberId: id, from: a, to: b, date: todayKey() }); const s = Z.createSession({ memberId: id, kind: 'mem', pages: Array.from({ length: b - a + 1 }, (_, i) => a + i), evaluatorId: Z.user.id }); Z.submitSession(s.id, { grade: 'ممتاز', decision: 'approve' }); }));
      for (let d = 20; d >= 0; d--) {
        Object.keys(plan).forEach((id, k) => {
          if ((d + k) % 3 === 2 && d) return; const pl = plan[id]; const ev = id === 'iman' ? 'abdullah' : id === 'abdullah' ? 'iman' : (d + k) % 2 ? 'iman' : 'abdullah';
          if (id === 'kenan' && pl.p > 604) pl.p = 590; if (id === 'alyaman' && pl.p > 590) pl.p = 570; if (id === 'abdulrahman' && pl.p > 597) pl.p = 578;
          Clock.now = at(d, 16 + k * .3); Z.user = Z.member(ev); const date = todayKey();
          if (Z.approvedPages(id).has(pl.p)) { pl.p++; return; }
          Z.registerMemorization({ memberId: id, from: pl.p, to: pl.p, date }); Clock.now = at(d, 19 + k * .2);
          if (d === 0 && k > 2) { pl.p++; return; } // leave some pending today
          const s = Z.createSession({ memberId: id, kind: 'mem', pages: [pl.p], evaluatorId: ev });
          const redo = (d * 7 + k) % 9 === 0;
          Z.submitSession(s.id, { grade: redo ? 'إعادة التسميع' : ['ممتاز', 'جيد جداً', 'ممتاز', 'جيد'][(d + k) % 4], errorCount: redo ? 4 : (d + k) % 3, decision: redo ? 'redo' : 'approve', notes: redo ? 'نراجعها غداً بإذن الله' : '' });
          if (!redo) pl.p++;
          if ((d + k) % 2 === 0 && Z.approvedPages(id).size) { const ap = [...Z.approvedPages(id)].sort((x, y) => x - y); const from = ap[Math.floor(((d * 13 + k * 7) % 97) / 97 * ap.length)] || ap[0]; Clock.now = at(d, 20); Z.addRevision({ memberId: id, from, to: Math.min(604, from + 1 + (k % 3)), date, grade: Z.db.settings.revGrades[(d + k) % 3] }); }
        });
        if (d === 9) { Clock.now = at(d, 21); Z.user = Z.member('abdullah'); Z.addViolation({ memberId: 'abdulrahman', reason: 'تأخّر عن موعد التسميع دون عذر', start: new Date(at(d, 21)()).toISOString(), end: new Date(at(d, 21)() + DAY).toISOString() }); }
        if (d % 5 === 1) { ['alyaman', 'kenan', 'abdullah'].forEach((id, k) => { Clock.now = at(d, 21 + k * .1); Z.user = Z.member(id === 'abdullah' ? 'iman' : 'abdullah'); const pool = Z.testPool(id); if (pool.length < 2) return; const t = Z.createTest({ memberId: id, pages: Z.pickRandom(pool, 2) }); const e = {}; if ((d + k) % 3 === 0) e[t.pages[0]] = 1; Z.approveTest(t.id, { errors: e, notes: '' }); }); }
      }
      Clock.now = at(12, 22); Z.user = Z.member('abdullah'); Z.walletAction({ memberId: 'alyaman', kind: 'payout', amount: 20, reason: 'مصروف نهاية الأسبوع' }); Z.walletAction({ memberId: 'kenan', kind: 'bonus', amount: 5, reason: 'تشجيع على الالتزام' });
      Clock.now = at(0, 8); const ws = weekStart(todayKey());
      Z.createChallenge({ title: 'تحدي زادُنا الأسبوعي', start: ws, end: addDays(ws, 6), family: { metric: 'mem', target: 20 }, goals: { abdullah: { metric: 'rev', target: 10 }, iman: { metric: 'mem', target: 5 }, alyaman: { metric: 'mem', target: 4 }, abdulrahman: { metric: 'days', target: 5 }, kenan: { metric: 'mem', target: 3 } }, bonus: 5 });
    } catch (e) { console.error('demo build', e); } finally { Clock.now = keep.now; Z.onChange = keep.oc; } const out = Z.db; Z.load(keep.db); Z.user = keep.user; return out;
  },
};

/* ---------------- router ---------------- */
function parseHash() { const h = location.hash.replace(/^#\/?/, ''); const [r, ...p] = h.split('/'); return { r: r || '', p }; }
const STAFF_ROUTES = { home: 1, more: 1, family: 1, member: 1, map: 1, mem: 1, recite: 1, rev: 1, tests: 1, wallet: 1, vio: 1, challenge: 1, badges: 1, reports: 1, settings: 1, cert: 1 };
function render() {
  const root = $('#app'); let { r, p } = parseHash(); let view;
  if (!Z.db.meta.setupDone && App.mode === 'real') view = V.setup();
  else if (!Z.user) view = V.login();
  else if (Z.user.role === 'child') { if (r === 'cert') view = V.cert(p); else view = V.kid(r === 'kid' ? p : []); }
  else { if (!STAFF_ROUTES[r]) { r = 'home'; p = []; } view = V[r](p); }
  closeSheet(); root.innerHTML = view.html + (view.nav ? bottomNav(view.nav) : '');
  document.body.classList.toggle('no-nav', !view.nav && !view.kid); document.body.classList.toggle('kid', !!view.kid);
  window.scrollTo({ top: 0 }); view.mount && view.mount(root);
}
window.addEventListener('hashchange', () => { if (Z.user) render(); });

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const pk = e.target.closest('.chips[data-pick] .pick'); if (pk && !pk.dataset.act) {
    const box = pk.closest('.chips'), name = box.dataset.pick, v = pk.dataset.v; $$('.pick', box).forEach(b => b.classList.toggle('on', b === pk));
    const hid = box.parentElement.querySelector(`input[type=hidden][name="${name}"]`) || box.nextElementSibling; if (hid && hid.name === name) hid.value = v;
    if (box.dataset.rc) { UI.rc[box.dataset.rc] = v; UI.rc.pages = null; render(); } else if (box.dataset.ui) { UI[box.dataset.ui] = v; render(); } else if (box.dataset.td) { UI.td = { memberId: v, src: 'all', juz: [], surahs: [], count: UI.td?.count || 3, pages: [] }; render(); } else if (box.dataset.route) location.hash = box.dataset.route + v;
    return;
  }
  const a = e.target.closest('[data-act]'); if (a && a.tagName !== 'SELECT' && a.tagName !== 'INPUT') { const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); } return; }
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); location.hash = g.dataset.go; }
});
document.addEventListener('change', e => { const a = e.target.closest('select[data-act],input[data-act]'); if (a && a.dataset.act !== 'tglpick' && ACT[a.dataset.act]) ACT[a.dataset.act](a, e); else if (a && a.dataset.act === 'tglpick') ACT.tglpick(a); });
let lastSubmit = 0;
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); if (Date.now() - lastSubmit < 600) return; lastSubmit = Date.now();
  const fd = new FormData(f); const sub = e.submitter; if (sub && sub.name) fd.set(sub.name, sub.value); const h = FORM[f.dataset.form]; if (h) h(fd, f, sub); });

/* ---------------- boot ---------------- */
(async function boot() {
  Theme.apply(Theme.get()); initSky(); App.open();
  if (!LS.ok) toast('ذاكرة الجهاز غير متاحة في هذا الوضع — لن تُحفظ البيانات بعد الإغلاق', 'err');
  await splash(); render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
